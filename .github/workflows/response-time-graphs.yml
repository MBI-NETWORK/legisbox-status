name: Response time graphs
on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  response-time-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPPTIME_GH_PAT }}
      - name: Generate response time graphs
        uses: upptime/uptime-monitor@master
        with:
          command: graphs
        env:
          GH_PAT: ${{ secrets.UPPTIME_GH_PAT }}
