name: Deploy status page
on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: upptime/uptime-monitor@master
        with:
          UPPTIME_GH_PAT: ${{ secrets.UPPTIME_GH_PAT }}
          runner: static-site
        env:
          GH_PAT: ${{ secrets.UPPTIME_GH_PAT }}
